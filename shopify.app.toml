# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "694837c36cee3cd1802aa50b11788cfb"
application_url = "https://lenscraftclone.vercel.app"
embedded = true
name = "LensCraft Clone"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_app_proxy,read_products,write_products,write_metaobjects,write_metaobject_definitions,read_cart_transforms,write_cart_transforms"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://lenscraftclone.vercel.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "https://lenscraftclone.vercel.app/apps/lenscraftclone"
prefix = "apps"
subpath = "lenscraftclone"
