
query CartTransformRunInput {
  cart {
    lines {
      id
      quantity

      lensGroup: attribute(key: "_lens_group") {
        value
      }

      lensParent: attribute(key: "_lens_parent") {
        value
      }

      lensDetails: attribute(key: "_lens_details") {
        value
      }

      merchandise {
        __typename
        ... on ProductVariant {
          id
        }
      }
    }
  }
}
